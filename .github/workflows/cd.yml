name: CD (Deploy)

on:
  workflow_dispatch:
    inputs:
      site:
        description: '选择部署动作'
        required: true
        type: choice
        options:
          - deploy
          - rollback

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy (${{ inputs.site }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase GHCR path
        id: ghcr
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${owner}/infinite-canvas-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/infinite-canvas:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # ═══════════════════════════════════════════════════════════════
      # deploy
      # ═══════════════════════════════════════════════════════════════

      - name: deploy — sync deploy assets
        if: inputs.site == 'deploy'
        run: |
          HOST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          KEY="$HOME/.ssh/deploy-key"

          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.SSH_KEY }}" > "$KEY"
          chmod 600 "$KEY"

          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new "$HOST" "mkdir -p /opt/infinite-canvas"
          scp -i "$KEY" -o StrictHostKeyChecking=accept-new \
            deploy/docker-compose.prod.yml \
            deploy/Caddyfile \
            "$HOST:/opt/infinite-canvas/"

      - name: deploy — generate .env from secrets and sync
        if: inputs.site == 'deploy'
        run: |
          HOST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          KEY="$HOME/.ssh/deploy-key"

          cat > /tmp/infinite-canvas.env <<'ENVEOF'
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRE_HOURS=${{ secrets.JWT_EXPIRE_HOURS }}
          PORT=8088
          PUBLIC_BASE_URL=${{ secrets.PUBLIC_BASE_URL }}
          DATABASE_DSN=${{ secrets.DATABASE_DSN }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          AMAZON_S3_URL=${{ secrets.AMAZON_S3_URL }}
          AMAZON_REGION=${{ secrets.AMAZON_REGION }}
          AMAZON_S3_ACCESS_KEY=${{ secrets.AMAZON_S3_ACCESS_KEY }}
          AMAZON_S3_SECRET_KEY=${{ secrets.AMAZON_S3_SECRET_KEY }}
          LINUX_DO_CLIENT_ID=${{ secrets.LINUX_DO_CLIENT_ID }}
          LINUX_DO_CLIENT_SECRET=${{ secrets.LINUX_DO_CLIENT_SECRET }}
          ENVEOF

          scp -i "$KEY" -o StrictHostKeyChecking=accept-new \
            /tmp/infinite-canvas.env "$HOST:/opt/infinite-canvas/.env"
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new "$HOST" "chmod 600 /opt/infinite-canvas/.env"
          rm -f /tmp/infinite-canvas.env

      - name: deploy — pull, tag, restart
        if: inputs.site == 'deploy'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            DEPLOY_API="${{ steps.ghcr.outputs.api }}"
            DEPLOY_WEB="${{ steps.ghcr.outputs.web }}"
            cd /opt/infinite-canvas

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u eldenpdx --password-stdin

            docker pull "$DEPLOY_API"
            docker pull "$DEPLOY_WEB"

            # Save rollback
            if docker image inspect infinite-canvas-api:latest >/dev/null 2>&1; then
              docker tag infinite-canvas-api:latest infinite-canvas-api:rollback
              echo "Saved rollback image: infinite-canvas-api:rollback"
            fi
            if docker image inspect infinite-canvas:latest >/dev/null 2>&1; then
              docker tag infinite-canvas:latest infinite-canvas:rollback
              echo "Saved rollback image: infinite-canvas:rollback"
            fi

            # Tag this commit as the local runtime image
            docker tag "$DEPLOY_API" infinite-canvas-api:latest
            docker tag "$DEPLOY_WEB" infinite-canvas:latest

            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: deploy — health check
        if: inputs.site == 'deploy'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            EXPECTED_VERSION="${{ github.sha }}"
            PUBLIC_BASE_URL="${{ secrets.PUBLIC_BASE_URL }}"
            for i in $(seq 1 30); do
              local_version=$(curl --connect-timeout 3 --max-time 10 -fsS http://127.0.0.1/build-version.txt 2>/dev/null || true)
              api_health=$(curl --connect-timeout 3 --max-time 10 -fsS http://127.0.0.1/api/health 2>/dev/null || true)
              public_api_health=$(curl --connect-timeout 3 --max-time 10 -fsS -H 'Cache-Control: no-cache' "${PUBLIC_BASE_URL%/}/api/health" 2>/dev/null || true)
              public_html=$(curl --connect-timeout 3 --max-time 10 -fsS -H 'Cache-Control: no-cache' "${PUBLIC_BASE_URL%/}/" 2>/dev/null || true)
              public_version=$(curl --connect-timeout 3 --max-time 10 -fsS -H 'Cache-Control: no-cache' "${PUBLIC_BASE_URL%/}/build-version.txt" 2>/dev/null || true)
              if [ "$local_version" = "$EXPECTED_VERSION" ] \
                && [ "$api_health" = "ok" ] \
                && [ "$public_api_health" = "ok" ] \
                && [ "$public_version" = "$EXPECTED_VERSION" ] \
                && printf '%s' "$public_html" | grep -Fq "content=\"$EXPECTED_VERSION\""; then
                echo "✓ Frontend $EXPECTED_VERSION and API are live after ${i}s"
                exit 0
              fi
              echo "Attempt $i/30: local='$local_version', public='$public_version', local_api='$api_health', public_api='$public_api_health'"
              sleep 2
            done
            echo "✗ Deployed frontend version is not live. Recent logs:"
            cd /opt/infinite-canvas
            docker compose -f docker-compose.prod.yml logs --tail=50
            exit 1

      # ═══════════════════════════════════════════════════════════════
      # rollback
      # ═══════════════════════════════════════════════════════════════

      - name: rollback — tag rollback as latest and restart
        if: inputs.site == 'rollback'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/infinite-canvas

            for img in infinite-canvas-api infinite-canvas; do
              if ! docker image inspect ${img}:rollback >/dev/null 2>&1; then
                echo "✗ No rollback image found (${img}:rollback missing)"
                exit 1
              fi
              docker tag ${img}:rollback ${img}:latest
            done

            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: rollback — health check
        if: inputs.site == 'rollback'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1/api/health >/dev/null 2>&1; then
                echo "✓ Rollback healthy after ${i}s"
                exit 0
              fi
              echo "Attempt $i/30: waiting..."
              sleep 2
            done
            echo "✗ Rollback health check timeout."
            exit 1
