name: CD (Deploy)

on:
  workflow_dispatch:
    inputs:
      site:
        description: "选择部署动作"
        required: true
        type: choice
        options:
          - deploy
          - rollback
      reset_sessions:
        description: "轮换 JWT_SECRET，并允许本次部署重置现有登录会话"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy (${{ inputs.site }})
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.site }}
      RESET_SESSIONS: ${{ inputs.reset_sessions && '1' || '0' }}
      TARGET_SHA: ${{ github.sha }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || secrets.PUBLIC_BASE_URL || 'https://canvan.ai' }}
      DEPLOY_ROOT: /opt/infinite-canvas
    steps:
      - uses: actions/checkout@v4

      - name: Configuration — validate required production values
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DATABASE_DSN: ${{ secrets.DATABASE_DSN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          set -Eeuo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY GHCR_TOKEN ADMIN_USERNAME ADMIN_PASSWORD DATABASE_DSN POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB; do
            [[ -n "${!name}" ]] || { echo "::error::$name is required"; exit 1; }
          done
          [[ "$RESET_SESSIONS" == 0 || "$ACTION" == deploy ]] || {
            echo "::error::reset_sessions is only valid for deploy"
            exit 1
          }
          trimmed=$(printf '%s' "$JWT_SECRET" | tr -d '[:space:]')
          [[ -n "$trimmed" && "$trimmed" != "infinite-canvas" ]] || {
            echo "::error::JWT_SECRET is empty or still uses the application default; replace it with a random GitHub Actions secret"
            exit 1
          }

      - name: Image check — resolve immutable GHCR images
        id: images
        run: |
          set -Eeuo pipefail
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "api_repo=ghcr.io/$owner/infinite-canvas-api" >> "$GITHUB_OUTPUT"
          echo "web_repo=ghcr.io/$owner/infinite-canvas" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/$owner/infinite-canvas-api:$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$owner/infinite-canvas:$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Image check — fail before server changes when deploy images are missing
        if: env.ACTION == 'deploy'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u '${{ steps.images.outputs.owner }}' --password-stdin
          docker manifest inspect "$API_IMAGE" >/dev/null
          docker manifest inspect "$WEB_IMAGE" >/dev/null

      - name: Configuration sync — prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy-key"
          chmod 600 "$HOME/.ssh/deploy-key"
          ssh -i "$HOME/.ssh/deploy-key" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_ROOT/state' '$DEPLOY_ROOT/data' && chmod 700 '$DEPLOY_ROOT/state'"

      - name: Authentication — capture the current production JWT
        id: auth
        env:
          AUTH_USERNAME: ${{ secrets.DEPLOY_AUTH_USERNAME || secrets.ADMIN_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.DEPLOY_AUTH_PASSWORD || secrets.ADMIN_PASSWORD }}
        run: |
          set -Eeuo pipefail
          case "$PUBLIC_BASE_URL" in
            http://*|https://*) ;;
            *) PUBLIC_BASE_URL="https://$PUBLIC_BASE_URL" ;;
          esac
          PUBLIC_BASE_URL=${PUBLIC_BASE_URL%/}
          payload=$(jq -n --arg username "$AUTH_USERNAME" --arg password "$AUTH_PASSWORD" '{username:$username,password:$password}')
          umask 077
          : > /tmp/deploy.jwt
          : > /tmp/deploy-user-id
          : > /tmp/deploy-login.json
          if [[ "$RESET_SESSIONS" == 1 ]]; then
            printf '%s' "$payload" > /tmp/deploy-login.json
            echo "::warning::Existing login sessions will be reset after this deployment"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          response=
          token=
          user_id=
          if response=$(curl -L --connect-timeout 5 --max-time 20 -fsS -H 'Content-Type: application/json' --data "$payload" "$PUBLIC_BASE_URL/api/auth/login" 2>/dev/null); then
            token=$(jq -er '.data.token | select(length > 0)' <<< "$response" 2>/dev/null || true)
            user_id=$(jq -er '.data.user.id | select(length > 0)' <<< "$response" 2>/dev/null || true)
          fi
          if [[ -n "$token" && -n "$user_id" ]]; then
            echo "::add-mask::$token"
            printf '%s' "$token" > /tmp/deploy.jwt
            printf '%s' "$user_id" > /tmp/deploy-user-id
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$ACTION" == deploy ]]; then
            echo "::error::Unable to capture the current production JWT"
            exit 1
          else
            echo "::warning::Current login is unavailable; rollback will proceed without authentication continuity checks"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configuration sync — upload deployment assets and environment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRE_HOURS: ${{ secrets.JWT_EXPIRE_HOURS }}
          DATABASE_DSN: ${{ secrets.DATABASE_DSN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          AMAZON_S3_URL: ${{ secrets.AMAZON_S3_URL }}
          AMAZON_REGION: ${{ secrets.AMAZON_REGION }}
          AMAZON_S3_ACCESS_KEY: ${{ secrets.AMAZON_S3_ACCESS_KEY }}
          AMAZON_S3_SECRET_KEY: ${{ secrets.AMAZON_S3_SECRET_KEY }}
          LINUX_DO_CLIENT_ID: ${{ secrets.LINUX_DO_CLIENT_ID }}
          LINUX_DO_CLIENT_SECRET: ${{ secrets.LINUX_DO_CLIENT_SECRET }}
          CADDY_SITE_ADDRESS: ${{ vars.CADDY_SITE_ADDRESS || ':80' }}
          DRAIN_SECONDS: ${{ vars.DRAIN_SECONDS || '30' }}
          SHUTDOWN_TIMEOUT: ${{ vars.SHUTDOWN_TIMEOUT || '30s' }}
          API_STOP_GRACE_PERIOD: ${{ vars.API_STOP_GRACE_PERIOD || '40s' }}
          API_IMAGE_REPO: ${{ steps.images.outputs.api_repo }}
          WEB_IMAGE_REPO: ${{ steps.images.outputs.web_repo }}
        run: |
          set -Eeuo pipefail
          key="$HOME/.ssh/deploy-key"
          host="$SSH_USER@$SSH_HOST"
          dotenv_line() {
            local escaped=${2//\'/\\\'}
            printf "%s='%s'\n" "$1" "$escaped"
          }
          {
            dotenv_line ADMIN_USERNAME "$ADMIN_USERNAME"
            dotenv_line ADMIN_PASSWORD "$ADMIN_PASSWORD"
            dotenv_line JWT_SECRET "$JWT_SECRET"
            dotenv_line JWT_EXPIRE_HOURS "${JWT_EXPIRE_HOURS:-168}"
            dotenv_line PORT 8088
            dotenv_line PUBLIC_BASE_URL "$PUBLIC_BASE_URL"
            dotenv_line DATABASE_DSN "$DATABASE_DSN"
            dotenv_line POSTGRES_USER "$POSTGRES_USER"
            dotenv_line POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
            dotenv_line POSTGRES_DB "$POSTGRES_DB"
            dotenv_line AMAZON_S3_URL "$AMAZON_S3_URL"
            dotenv_line AMAZON_REGION "${AMAZON_REGION:-ap-southeast-1}"
            dotenv_line AMAZON_S3_ACCESS_KEY "$AMAZON_S3_ACCESS_KEY"
            dotenv_line AMAZON_S3_SECRET_KEY "$AMAZON_S3_SECRET_KEY"
            dotenv_line LINUX_DO_CLIENT_ID "$LINUX_DO_CLIENT_ID"
            dotenv_line LINUX_DO_CLIENT_SECRET "$LINUX_DO_CLIENT_SECRET"
            dotenv_line CADDY_SITE_ADDRESS "$CADDY_SITE_ADDRESS"
            dotenv_line DRAIN_SECONDS "$DRAIN_SECONDS"
            dotenv_line SHUTDOWN_TIMEOUT "$SHUTDOWN_TIMEOUT"
            dotenv_line API_STOP_GRACE_PERIOD "$API_STOP_GRACE_PERIOD"
            dotenv_line API_IMAGE_REPO "$API_IMAGE_REPO"
            dotenv_line WEB_IMAGE_REPO "$WEB_IMAGE_REPO"
            dotenv_line PULL_IMAGES 1
          } > /tmp/infinite-canvas.env
          scp -i "$key" -o StrictHostKeyChecking=accept-new \
            deploy/docker-compose.prod.yml deploy/blue-green.sh \
            "$host:$DEPLOY_ROOT/"
          scp -i "$key" -o StrictHostKeyChecking=accept-new \
            deploy/slot.Caddyfile "$host:$DEPLOY_ROOT/slot.Caddyfile"
          scp -i "$key" -o StrictHostKeyChecking=accept-new \
            /tmp/infinite-canvas.env /tmp/deploy.jwt /tmp/deploy-user-id /tmp/deploy-login.json \
            "$host:$DEPLOY_ROOT/"
          ssh -i "$key" -o StrictHostKeyChecking=accept-new "$host" \
            "mv '$DEPLOY_ROOT/infinite-canvas.env' '$DEPLOY_ROOT/.env'; mv '$DEPLOY_ROOT/deploy.jwt' '$DEPLOY_ROOT/state/deploy.jwt'; mv '$DEPLOY_ROOT/deploy-user-id' '$DEPLOY_ROOT/state/deploy-user-id'; mv '$DEPLOY_ROOT/deploy-login.json' '$DEPLOY_ROOT/state/deploy-login.json'; chmod 600 '$DEPLOY_ROOT/.env' '$DEPLOY_ROOT/state/deploy.jwt' '$DEPLOY_ROOT/state/deploy-user-id' '$DEPLOY_ROOT/state/deploy-login.json'; chmod +x '$DEPLOY_ROOT/blue-green.sh'"
          rm -f /tmp/infinite-canvas.env /tmp/deploy.jwt /tmp/deploy-user-id /tmp/deploy-login.json

      - name: Image check — authenticate the production host to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/deploy-key" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '${{ steps.images.outputs.owner }}' --password-stdin"

      - name: Deploy — prewarm, switch, verify, drain, and clean up
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          host="$SSH_USER@$SSH_HOST"
          key="$HOME/.ssh/deploy-key"
          if [[ "$ACTION" == deploy && "$RESET_SESSIONS" == 1 ]]; then
            command="RESET_SESSIONS=1 ./blue-green.sh deploy '$TARGET_SHA'"
          elif [[ "$ACTION" == deploy ]]; then
            command="./blue-green.sh deploy '$TARGET_SHA'"
          elif [[ '${{ steps.auth.outputs.available }}' == true ]]; then
            command="./blue-green.sh rollback"
          else
            command="ALLOW_MISSING_AUTH=1 ./blue-green.sh rollback"
          fi
          ssh -i "$key" -o StrictHostKeyChecking=accept-new "$host" \
            "cd '$DEPLOY_ROOT' && trap 'rm -f state/deploy.jwt state/deploy-user-id state/deploy-login.json' EXIT; $command"

      - name: Cleanup — remove temporary authentication files
        if: always()
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rm -f /tmp/deploy.jwt /tmp/deploy-user-id /tmp/deploy-login.json /tmp/infinite-canvas.env
          if [[ -f "$HOME/.ssh/deploy-key" ]]; then
            ssh -i "$HOME/.ssh/deploy-key" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
              "rm -f '$DEPLOY_ROOT/deploy.jwt' '$DEPLOY_ROOT/deploy-user-id' '$DEPLOY_ROOT/deploy-login.json' '$DEPLOY_ROOT/state/deploy.jwt' '$DEPLOY_ROOT/state/deploy-user-id' '$DEPLOY_ROOT/state/deploy-login.json'"
          fi
