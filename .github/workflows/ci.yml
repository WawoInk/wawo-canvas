name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # --- Go lint & test ---
  go-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infinite_canvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infinite_canvas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_DSN: postgres://postgres:postgres@localhost:5432/infinite_canvas_test?sslmode=disable
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: infinite_canvas_test
      JWT_SECRET: generation-ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Lint (go vet)
        run: go vet ./...

      - name: Test
        run: go test -p 1 ./...

  # --- Frontend lint ---
  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Format check
        working-directory: web
        run: bun run format:check

      - name: Session continuity tests
        working-directory: web
        run: bun test test/session-monitor.test.ts test/user-session-hydration.test.ts

      - name: Video resolution tests
        working-directory: web
        run: bun test src/components/video-settings-resolution.test.tsx

      - name: Canvas local import tests
        working-directory: web
        run: bun test test/canvas-local-import.test.tsx

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check CD contract
        run: deploy/test/cd-workflow.test.sh

      - name: Test production-shaped blue-green deployment
        run: deploy/test/blue-green.test.sh

  # --- Build & push ARM images ---
  build:
    needs: [go-check, web-lint, deploy-check]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API: cross-compile Go binary natively on runner, then COPY into minimal image
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cross-compile API binary
        run: |
          mkdir -p .docker-build
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o .docker-build/api-gateway .

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/eldenpdx/infinite-canvas-api:latest
            ghcr.io/eldenpdx/infinite-canvas-api:candidate-arm64
            ghcr.io/eldenpdx/infinite-canvas-api:${{ github.sha }}
          cache-from: type=gha,scope=api-arm64
          cache-to: type=gha,mode=max,scope=api-arm64

      # Web: bun + caddy
      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/eldenpdx/infinite-canvas:latest
            ghcr.io/eldenpdx/infinite-canvas:candidate-arm64
            ghcr.io/eldenpdx/infinite-canvas:${{ github.sha }}
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web-arm64
          cache-to: type=gha,mode=max,scope=web-arm64
