name: ${COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 10

  api:
    image: infinite-canvas-deploy-test-api:legacy
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: "8088"
      DEPLOY_SHA: legacy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/api/health | grep -qx ok"]
      interval: 1s
      timeout: 2s
      retries: 10

  web:
    image: infinite-canvas-deploy-test-web:legacy
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: api:8088
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./legacy.Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
